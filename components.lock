# Every external component MEMTRACE runs against, in one place. Shell scripts source this file; Python reads it
# with memtrace.components; `memtrace components check` compares it with what is installed, and CI fails when a
# file in deploy/, scripts/ or epp-plugins/go.mod names a different version.
#
# To upgrade a component: change it here, run `memtrace components check`, rerun the qualification scenario, and
# keep the change only if the scenario passes (README: "Upgrading components").

# Engine on the Apple GPU: vllm-metal and the vLLM it runs on (Python venv at VLLM_METAL_VENV).
VLLM_METAL_VERSION=0.30.0
VLLM_METAL_VLLM_VERSION=0.30.0
# The development build under test (venv at VLLM_METAL_DEV_VENV, default ~/.venv-vllm-metal-dev): the first with
# SSD KV offload and KV events for the disk tier. Wheels: github.com/vllm-project/vllm-metal and vllm releases.
VLLM_METAL_DEV_VERSION=0.31.0.dev20261010042608
VLLM_METAL_DEV_VLLM_VERSION=0.31.0

# llm-d router (EPP): the version epp-plugins/go.mod builds against and whose kind dev environment `make up` runs.
LLMD_ROUTER_TAG=v0.11.0

