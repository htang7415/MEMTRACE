[project]
name = "memtrace"
version = "0.1.0"
description = "Stateful safety evaluation for memory-enabled agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pydantic>=2.0",
]

[project.scripts]
memtrace = "memtrace.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.0",
  "ruff>=0.12",
]
inference = [
  "mlx-lm>=0.21",
  "sentence-transformers>=3.0",
]
retrieval = [
  "sentence-transformers>=3.0",
]
gemini = [
  "google-genai>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/memtrace/cli.py", "src/memtrace/config.py"]
python_version = "3.11"
strict = true
