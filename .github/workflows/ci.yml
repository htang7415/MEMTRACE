name: ci

# Lint, types, tests, the result-schema check, the Go gateway and llm-d plugins, the dashboard, the memory-risk
# regression gate, and a CPU performance smoke gate. No paid API calls except the scheduled canary.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - uses: actions/setup-go@v7  # gateway end-to-end tests build the Go binary
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Result schema is current
        run: python -m memtrace.harness schema --check
      - name: Test
        run: python -m pytest -q  # dataset-dependent tests skip without data/public
      - name: Build and smoke-test the package
        if: matrix.python-version == '3.13'
        run: |
          python -m build
          python -m venv /tmp/memtrace-wheel-smoke
          /tmp/memtrace-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/memtrace-wheel-smoke/bin/memtrace --version

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  epp-plugins:
    # The plugins compile only inside the pinned llm-d-router tree, as in scripts/build_epp.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llm-d-router v0.11.0
        run: git clone -q --depth 1 --branch v0.11.0 https://github.com/llm-d/llm-d-router.git llm-d-router
      - uses: actions/setup-go@v7
        with:
          go-version-file: llm-d-router/go.mod
          cache-dependency-path: llm-d-router/go.sum
      - name: Vet and test
        run: |
          test -z "$(gofmt -l epp-plugins)"
          dir=pkg/epp/framework/plugins/scheduling/scorer/capacityload
          mkdir -p "llm-d-router/$dir"
          cp epp-plugins/capacityload/*.go "llm-d-router/$dir/"
          cd llm-d-router
          go vet "./$dir/"
          go test "./$dir/"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -x -P SCRIPTDIR -S warning scripts/*.sh

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Types match the result JSON Schema
        run: npm run types && git diff --exit-code src/types
      - run: npx vitest run
      - run: npm run build  # tsc type check + production bundle (data is exported locally, not in CI)

  regression-gate:
    # The memory-risk benchmark's deterministic pilot slice against a frozen baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEMTRACE_ROOT: /tmp/memtrace-regression-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Build deterministic assets (profile backend, lexical retrieval)
        run: |
          memtrace --config configs/memrisk/profile.toml assets corpus
          memtrace --config configs/memrisk/profile.toml assets episodes
          memtrace --config configs/memrisk/profile.toml assets verify
      - name: Run deterministic pilot slice
        run: memtrace --config configs/memrisk/profile.toml run pilot --out-dir "$MEMTRACE_ROOT/pilot" --force
      - name: Gate against frozen regression baseline
        run: |
          memtrace evaluate gate \
            --baseline tests/fixtures/regression/metrics.json \
            --candidate "$MEMTRACE_ROOT/pilot/metrics.json"

  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLAMA_BUILD: b11454
      LLAMA_SHA256: 02c892db355f05876e4fea2d0131881c987df3349dbcea35a30d1256822d3987
      MODEL_URL: https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
      MODEL_SHA256: 9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Cache model and llama.cpp
        uses: actions/cache@v6
        with:
          path: |
            models/gguf/Qwen3-0.6B-Q8_0.gguf
            ~/llama.tar.gz
          key: perf-smoke-${{ env.LLAMA_BUILD }}-${{ env.MODEL_SHA256 }}
      - name: Fetch pinned llama.cpp CPU build and Qwen3-0.6B Q8_0
        run: |
          mkdir -p models/gguf
          [ -f ~/llama.tar.gz ] || curl -fsSL -o ~/llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  ${HOME}/llama.tar.gz" | sha256sum -c -
          [ -f models/gguf/Qwen3-0.6B-Q8_0.gguf ] || curl -fsSL -o models/gguf/Qwen3-0.6B-Q8_0.gguf "${MODEL_URL}"
          echo "${MODEL_SHA256}  models/gguf/Qwen3-0.6B-Q8_0.gguf" | sha256sum -c -
          tar xzf ~/llama.tar.gz -C ~
          echo "${HOME}/llama-${LLAMA_BUILD}" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${HOME}/llama-${LLAMA_BUILD}" >> "$GITHUB_ENV"
      - name: Pull inference-sim
        run: docker pull ghcr.io/llm-d/llm-d-inference-sim:v0.11.4
      - name: Run smoke experiments
        run: |
          llama-server --version
          memtrace run experiment experiments/ci_smoke_sim.yaml --out artifacts/ci
          memtrace run experiment experiments/ci_smoke_llamacpp.yaml --out artifacts/ci
      - name: Performance gate
        run: python -m memtrace.harness.perf_gate experiments/perf_baseline.yaml artifacts/ci/*/results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-smoke-results
          retention-days: 14
          path: artifacts/ci/**

  canary:
    # The memory-risk benchmark's dense-retrieval + hosted-model path (configs/memrisk/gemini.toml), which the
    # regression gate never touches. A signal, not a merge gate: scheduled or manual only, never blocking, and
    # skipped without the repository secret (forks).
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    env:
      MEMTRACE_ROOT: /tmp/memtrace-canary-ci
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -r requirements/canary.lock  # pinned, not hashed (see CONTRIBUTING)
          python -m pip install --no-deps -e .
      - name: Skip if no GEMINI_API_KEY configured
        if: env.GEMINI_API_KEY == ''
        run: echo "GEMINI_API_KEY not set (e.g. on a fork); skipping canary." && exit 0
      - name: Build assets (dense retrieval)
        if: env.GEMINI_API_KEY != ''
        run: |
          memtrace --config configs/memrisk/gemini.toml assets corpus
          memtrace --config configs/memrisk/gemini.toml assets episodes
          memtrace --config configs/memrisk/gemini.toml assets index
          memtrace --config configs/memrisk/gemini.toml assets verify
      - name: Run small pilot slice against the gemini backend
        if: env.GEMINI_API_KEY != ''
        run: memtrace --config configs/memrisk/gemini.toml run pilot --limit 5 --out-dir "$MEMTRACE_ROOT/pilot" --force
