name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest tests
      - name: Build and smoke-test package
        if: matrix.python-version == '3.13'
        run: |
          python -m build
          python -m venv /tmp/memtrace-wheel-smoke
          /tmp/memtrace-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/memtrace-wheel-smoke/bin/memtrace --version

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -x -P SCRIPTDIR -S warning scripts/*.sh scripts/studies/*.sh

  epp-plugins:
    # The plugins compile only inside the pinned llm-d-router tree, as in scripts/build_epp.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llm-d-router v0.11.0
        run: git clone -q --depth 1 --branch v0.11.0 https://github.com/llm-d/llm-d-router.git llm-d-router
      - uses: actions/setup-go@v5
        with:
          go-version-file: llm-d-router/go.mod
          cache-dependency-path: llm-d-router/go.sum
      - name: Vet and test
        run: |
          test -z "$(gofmt -l epp-plugins)"
          dir=pkg/epp/framework/plugins/scheduling/scorer/capacityload
          mkdir -p "llm-d-router/$dir"
          cp epp-plugins/capacityload/*.go "llm-d-router/$dir/"
          cd llm-d-router
          go vet "./$dir/"
          go test "./$dir/"

  regression-gate:
    runs-on: ubuntu-latest
    env:
      MEMTRACE_ROOT: /tmp/memtrace-regression-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-lock.txt
          python -m pip install -e . --no-deps
      - name: Build deterministic assets (profile backend, lexical retrieval)
        run: |
          memtrace --config configs/profile.toml assets corpus
          memtrace --config configs/profile.toml assets episodes
          memtrace --config configs/profile.toml assets verify
      - name: Run deterministic pilot slice
        run: |
          memtrace --config configs/profile.toml run pilot \
            --out-dir "$MEMTRACE_ROOT/pilot" --force
      - name: Gate against frozen regression baseline
        run: |
          memtrace evaluate gate \
            --baseline tests/fixtures/regression/metrics.json \
            --candidate "$MEMTRACE_ROOT/pilot/metrics.json"

  canary:
    # Exercises the dense-retrieval + hosted-model path (configs/gemini.toml) that
    # regression-gate deliberately never touches (profile/lexical, no external
    # dependency, always-blocking). This job is a signal, not a merge gate: hosted
    # APIs are flaky by nature, so it never blocks PRs -- it only surfaces drift in
    # the dense/hosted path between scheduled runs.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    env:
      MEMTRACE_ROOT: /tmp/memtrace-canary-ci
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/canary-lock.txt
          python -m pip install -e . --no-deps
      - name: Skip if no GEMINI_API_KEY configured
        if: env.GEMINI_API_KEY == ''
        run: echo "GEMINI_API_KEY not set (e.g. on a fork); skipping canary." && exit 0
      - name: Build assets (dense retrieval)
        if: env.GEMINI_API_KEY != ''
        run: |
          memtrace --config configs/gemini.toml assets corpus
          memtrace --config configs/gemini.toml assets episodes
          memtrace --config configs/gemini.toml assets index
          memtrace --config configs/gemini.toml assets verify
      - name: Run small pilot slice against the gemini backend
        if: env.GEMINI_API_KEY != ''
        run: |
          memtrace --config configs/gemini.toml run pilot \
            --limit 5 --out-dir "$MEMTRACE_ROOT/pilot" --force
