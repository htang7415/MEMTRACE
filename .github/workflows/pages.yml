name: pages

# Publishes the results dashboard (dashboard/) to GitHub Pages from the committed data snapshot in
# dashboard/public/data (refresh it locally with `npm run data`, which writes aggregates only), with the
# memory-risk benchmark report at its existing path, results/benchmark/memtrace_results.html.
on:
  push:
    branches: [main]
    paths: ["dashboard/**", "results/benchmark/memtrace_results.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: |
          mkdir -p dashboard/dist/results/benchmark
          cp results/benchmark/memtrace_results.html dashboard/dist/results/benchmark/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
