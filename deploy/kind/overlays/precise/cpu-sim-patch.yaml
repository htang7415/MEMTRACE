# Phase 4c: the CPU simulator tokenizes through vllm-render and publishes KV-cache events to the EPP; the event
# topic names the pod as IP:port, so POD_IP carries the port.
- op: replace
  path: /spec/template/spec/containers/0/args
  value:
  - --mode=random
  - --port=8000
  - --model=Qwen/Qwen3-0.6B
  - --render-url=http://vllm-render.default.svc.cluster.local:8082
  - --zmq-endpoint=tcp://qwen3-0-6b-endpoint-picker.default.svc.cluster.local:5557
  - --max-model-len=4096
  - --max-num-seqs=8
  - --enable-kvcache=true
  - --kv-cache-size=585
  - --block-size=16
  - --latency-calculator=per-token
  - --prefill-overhead=50ms
  - --prefill-time-per-token=11400us
  - --inter-token-latency=210ms
  - --inter-token-latency-std-dev=45ms
  - --time-factor-under-load=1.3
- op: replace
  path: /spec/template/spec/containers/0/env
  value:
  - name: POD_ADDR
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
  - name: POD_IP
    value: $(POD_ADDR):8000
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
