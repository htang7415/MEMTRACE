# CPU-tier replica for the heterogeneous pool, simulated: a real vLLM CPU pod (~5.2 GiB) plus the real
# vllm-metal GPU engine made the 16 GB host page ~16 MB/s under load, which invalidates latency results.
# Calibrated to the real in-cluster vLLM CPU pod (4 pinned cores), measured alone on agent sessions at
# concurrency 4: 11.8 tok/s. Phase 1 per-token costs (3.8 ms prefill, 70 ms decode, measured with all
# 10 cores) gave 33.0 tok/s, 2.8x too fast; scaling both by 3.0 gives 11.1 tok/s (-6%). Tails stay
# optimistic (TTFT p95 9.8 s vs 14.5 s real, TPOT p95 0.25 s vs 0.34 s): the simulator does not model
# prefill stalling decode. x1.3 at 8 running sequences (Phase 1); 1 GiB KV cache (585 x 16-token blocks).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu-sim
  labels: {app: qwen3-0-6b-inference-pool}
spec:
  replicas: 1
  selector:
    matchLabels: {app: qwen3-0-6b-inference-pool, memtrace/replica: cpu-sim}
  template:
    metadata:
      labels:
        app: qwen3-0-6b-inference-pool
        llm-d.ai/component: decode
        llm-d.ai/role: decode
        memtrace/replica: cpu-sim
        memtrace/hardware: cpu
    spec:
      containers:
      - name: vllm
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
        imagePullPolicy: IfNotPresent
        args:
        - --mode=random
        - --port=8000
        - --model=Qwen/Qwen3-0.6B
        - --force-dummy-tokenizer
        - --max-model-len=4096
        - --max-num-seqs=8
        - --enable-kvcache=true
        - --kv-cache-size=585
        - --block-size=16
        - --latency-calculator=per-token
        - --prefill-overhead=50ms
        - --prefill-time-per-token=11400us
        - --inter-token-latency=210ms
        - --inter-token-latency-std-dev=45ms
        - --time-factor-under-load=1.3
        env:  # the simulator's KV-cache model requires the pod IP (as in llm-d's own vllm-d Deployment)
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        ports:
        - {name: http, containerPort: 8000}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 5
