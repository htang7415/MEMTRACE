# Capacity-proportional baseline: weighted random by hardware tier. With one replica per tier the
# GPU replica receives GPU_WEIGHT / (GPU_WEIGHT + 1) of requests (weighted round robin, in expectation).
# ${GPU_WEIGHT} is the GPU/CPU throughput ratio measured in the pool (scripts/stack.sh calibrate).
# endpoint-attribute-weight-scorer is experimental: the EPP needs --allow-experimental-plugins=true.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: label-producer
  name: hardware-labels
  parameters:
    labels:
    - label: memtrace/hardware
      attributeKey: hardware
- type: endpoint-attribute-weight-scorer
  name: hardware-capacity
  parameters:
    attributeKey: hardware
    producer: hardware-labels
    weights: {gpu: ${GPU_WEIGHT}, cpu: 1}
- type: decode-filter
- type: weighted-random-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: hardware-capacity
  - pluginRef: weighted-random-picker
