# MEMTRACE capacity-load-scorer alone: (running + waiting + 1) / capacity, capacity from the pod label
# memtrace/capacity (calibrated GPU/CPU throughput ratio). Needs the custom EPP image built by
# scripts/build_epp.sh (memtrace/llm-d-epp:v0.11.0-capacity).
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: decode-filter
- type: capacity-load-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: capacity-load-scorer
