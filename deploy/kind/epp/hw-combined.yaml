# The platform default (ADR 0003: prefix x2 + queue x1 + KV utilization x1) plus a static
# hardware-capacity preference, so an idle slow replica no longer looks as good as an idle fast one.
# ${GPU_WEIGHT}: see hw-weighted-random.yaml. Requires --allow-experimental-plugins=true.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: label-producer
  name: hardware-labels
  parameters:
    labels:
    - label: memtrace/hardware
      attributeKey: hardware
- type: endpoint-attribute-weight-scorer
  name: hardware-capacity
  parameters:
    attributeKey: hardware
    producer: hardware-labels
    weights: {gpu: ${GPU_WEIGHT}, cpu: 1}
- type: approx-prefix-cache-producer
- type: decode-filter
- type: prefix-cache-scorer
- type: queue-scorer
- type: kv-cache-utilization-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
  - pluginRef: kv-cache-utilization-scorer
    weight: 1
  - pluginRef: hardware-capacity
    weight: 2
