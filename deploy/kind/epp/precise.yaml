# combined.yaml with the precise prefix index: prefix affinity from the engines' own KV-cache events
# (BlockStored / BlockRemoved over ZMQ) instead of the EPP's approximate record of where it routed.
# Prompts are tokenized by the vllm-render Service; every replica must publish events to port 5557
# (topic kv@<pod-ip>:8000@<model>) and tokenize the same way, with 16-token blocks.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: token-producer
  parameters:
    modelName: Qwen/Qwen3-0.6B
    vllm:
      url: http://vllm-render.default.svc.cluster.local:8082
- type: precise-prefix-cache-producer
  parameters:
    tokenProcessorConfig:
      blockSizeTokens: 16
    kvEventsConfig:
      zmqEndpoint: tcp://0.0.0.0:5557
    indexerConfig:
      kvBlockIndexConfig:
        enableMetrics: true   # admissions / lookups / hits, to confirm the index is fed
- type: decode-filter
- type: prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: queue-scorer
- type: kv-cache-utilization-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
  - pluginRef: kv-cache-utilization-scorer
    weight: 1
