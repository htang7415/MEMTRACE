# Strict, cost-aware overflow: hosted endpoints (memtrace/hardware=hosted) are candidates only while the local
# pool is saturated (sum in-flight / sum capacity >= 0.66, i.e. 8 in flight on the capacity-11 GPU); then
# capacity-load-scorer picks among all endpoints. Needs the custom EPP image (scripts/build_epp.sh).
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: decode-filter
- type: overflow-filter
  parameters:
    saturationLoad: 0.66
- type: capacity-load-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: overflow-filter
  - pluginRef: max-score-picker
  - pluginRef: capacity-load-scorer
