schema_version: memtrace-experiment-v1
name: e11b-copilot-replay-4b
description: >
  E11b: E11 with Qwen3-4B (MLX 4-bit) on the GPU tier and the CPU simulator scaled to it (overlay qwen3-4b;
  run scripts/stack.sh calibrate with MODEL_4B=1 first), at 16 and 32 sessions. Was MEMTRACE's Phase 4b.
seed: 0
seed_strategy: fixed
repeats: 3
target:
  kind: llmd_kind
  params: {pool: hetero, policy: combined, overlay: qwen3-4b}
workload:
  kind: copilot_agent
  params: {shards: [date=2026-06-06/shard-0000.jsonl.gz], sessions: 16, max_tokens: 128, ignore_eos: true, warmup_requests: 2}
slo: {ttft_s: 2.0, tpot_s: 0.1, e2e_s: 3600}
matrix:
  target.policy: [combined, capacity, cache-cost]
  workload.sessions: [16, 32]
quiet_host: {max_load_1m: 6.0, wait_s: 90}
