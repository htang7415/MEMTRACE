schema_version: memtrace-resume-v1
name: item2-capacity
description: >
  Item 2: on one replica, does an SSD tier raise the number of agent sessions served at once within a resumed-TTFT
  SLO? R1's two compared arms (stock at equal memory, 1,353 GPU blocks; host pool + SSD, 768 blocks + 1 GiB pool) at
  three loads, each concurrency run with max_num_seqs at the same value. Levels and SLO come from the load probe
  (data/runs/20261012T045950Z-item2-load-probe) by the rule fixed in experiments/item2_load_probe.yaml: the stock arm
  first queued at 24 (requests waiting in 27% of samples; 0.3% at 12), so the levels are 12, 24, 36; its resumed TTFT
  p95 at 12 was 2,623 ms, so the SLO is 5,300 ms. The probe's top level used 81 of 200 sessions, so 200 are kept. The
  SSD cap is 20 GiB, twice R1's, as writes grow with load. Each trial starts with an empty store.
decision_rule: >
  Fixed 2026-10-12, before any trial of this spec ran. An arm's capacity is the highest level (12, 24, 36) whose
  resumed TTFT p95 with failed calls counted is <= 5,300 ms in all 3 repeats (0 if none). The tier wins if its
  capacity is at least one level above stock-equal-memory's; the same level is no win; a lower level means the tier
  costs capacity. Reported, not decided: resumed and all-calls TTFT p50, resumed recompute share, engine queue
  (share of samples with requests waiting), calls served and sessions used per level. Validity as R1: a trial that
  slept > 5 s or paged anything out while it measured does not count, and is rerun. Fallback for paged trials: a
  (level, arm, repeat) without a paging-free copy is graded on its paged copies only if every copy gives the same
  verdict (meets or misses the SLO); otherwise that repeat is ungraded and the rule reads the arm's capacity as
  incomplete at that level.
slo_ms: 5300  # read by `memtrace report resume-decision --rule capacity`
day: copilot_agent/date.2026-06-02.tar.gz
sessions: 200
seed: 0
repeats: 3
levels: [12, 24, 36]
idle_cap_s: 3600
resume_gap_s: 60
cache_dir: artifacts/cache/resume
kv_store_dir: ~/.cache/memtrace/kvstore  # internal SSD (APFS)
hardware:
  represents: one GPU replica whose KV cache holds about 7 median agent prompts, at three session loads
  runs_on: one Apple Silicon Mac, unified memory, vllm-metal, internal SSD
quiet_host: {max_load_1m: 4.0, wait_s: 120}
replay:
  concurrency: 12  # overridden per level
  horizon_s: 1800
  warmup_s: 300
  stagger_s: 60
  time_scale: 4
  scale: 0.03125
  output_scale: 0.05
  max_output_tokens: 16
  block_tokens: 16
  timeout_s: 300
arms:
  stock-equal-memory:
    target: {extra_args: [--block-size, "16", --num-gpu-blocks-override, "1353"]}
  host-pool+ssd:
    kv_tier: {host_pool_gib: 1, max_size_gib: 20}
target:
  model: Qwen/Qwen3-0.6B
  vllm: ~/.venv-vllm-metal-dev/bin/vllm
  max_model_len: 12272  # one block under the fixed cache, as vLLM requires
  max_num_seqs: 12  # overridden per level
  gpu_memory_utilization: 0.4
  enable_prefix_caching: true
  extra_args: [--block-size, "16", --num-gpu-blocks-override, "768"]
