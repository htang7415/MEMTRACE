schema_version: memtrace-experiment-v1
name: e8-routing-kind-sims
description: >
  E8: does cache-aware routing pay on agent sessions? llm-d on kind (make up) over 4 llm-d-inference-sim
  replicas calibrated to vllm-metal (deploy/kind/sim-args-vllm-metal.json), EPP policies random, queue,
  prefix and combined (deploy/kind/epp/), each applied with a cold restart of EPP and pool. 32 synthetic agent
  sessions x 8 turns resending their growing history, 32 output tokens (ignore_eos), closed-loop
  concurrency 8-32. Was MEMTRACE's Phase 2 routing study (routing_study_v2).
seed: 0
repeats: 3
target:
  kind: llmd_kind
  params: {pool: sims, replicas: 4, policy: combined}
workload:
  kind: agent_sessions
  params: {sessions: 32, turns: 8, max_tokens: 32, ignore_eos: true, concurrency: 8, warmup_requests: 2, timeout_s: 600}
slo: {ttft_s: 2.0, tpot_s: 0.1, e2e_s: 3600}
matrix:
  target.policy: [random, queue, prefix, combined]
  workload.concurrency: [8, 16, 32]
quiet_host: {max_load_1m: 6.0, wait_s: 90}
