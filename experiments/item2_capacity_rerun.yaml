schema_version: memtrace-resume-v1
name: item2-capacity-rerun
description: >
  Rerun of experiments/item2_capacity.yaml's host-pool+ssd trial at concurrency 24, repeat 2 (seed 2): it paged
  24,800 pages while it measured, and its resumed TTFT p95 (5,909 ms, just above the 5,300 ms SLO) decides whether
  the tier's capacity is 24 or 12. Same build, sizes, replay and seed; this trial replaces the paged one if it does
  not page. The sweep's other paged trials (concurrency 12 in repeats 1-2, 36 in repeat 2) are not rerun here: their
  verdicts are far from the SLO (958-2,817 ms at 12, 28,020 ms at 36).
decision_rule: >
  As experiments/item2_capacity.yaml (fixed 2026-10-12, before any trial ran); no rule changes.
slo_ms: 5300  # read by `memtrace report resume-decision --rule capacity`
day: copilot_agent/date.2026-06-02.tar.gz
sessions: 200
seed: 0
repeats: 3
first_repeat: 2  # seed 0 * 1000 + 2 only
levels: [24]
idle_cap_s: 3600
resume_gap_s: 60
cache_dir: artifacts/cache/resume
kv_store_dir: ~/.cache/memtrace/kvstore  # internal SSD (APFS)
hardware:
  represents: one GPU replica whose KV cache holds about 7 median agent prompts, at three session loads
  runs_on: one Apple Silicon Mac, unified memory, vllm-metal, internal SSD
quiet_host: {max_load_1m: 4.0, wait_s: 120}
replay:
  concurrency: 12  # overridden per level
  horizon_s: 1800
  warmup_s: 300
  stagger_s: 60
  time_scale: 4
  scale: 0.03125
  output_scale: 0.05
  max_output_tokens: 16
  block_tokens: 16
  timeout_s: 300
arms:
  host-pool+ssd:
    kv_tier: {host_pool_gib: 1, max_size_gib: 20}
target:
  model: Qwen/Qwen3-0.6B
  vllm: ~/.venv-vllm-metal-dev/bin/vllm
  max_model_len: 12272  # one block under the fixed cache, as vLLM requires
  max_num_seqs: 12  # overridden per level
  gpu_memory_utilization: 0.4
  enable_prefix_caching: true
  extra_args: [--block-size, "16", --num-gpu-blocks-override, "768"]
