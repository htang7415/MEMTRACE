schema_version: memtrace-experiment-v1
name: e12-gateway-load
description: >
  Load for the platform drills (scripts/drills.sh): agent sessions sent to the kind cluster's gateway as it
  stands, without changing the pool or policy. The failover drill deletes or kills a replica while this runs;
  the burst drill runs it at low, high and low load (--set) while KEDA scales the pool.
seed: 0
repeats: 1
target:
  kind: static_endpoints
  params: {urls: ["http://localhost:30080"], extra_body: {model: Qwen/Qwen3-0.6B}}
workload:
  kind: agent_sessions
  params: {sessions: 64, turns: 8, max_tokens: 32, ignore_eos: true, concurrency: 16, timeout_s: 600}
slo: {ttft_s: 2.0, tpot_s: 0.1, e2e_s: 3600}
quiet_host: {max_load_1m: 8.0, wait_s: 0}
